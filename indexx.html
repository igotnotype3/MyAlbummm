<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moje Pesme</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="../iznad.png" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <script src="assets/js/indexx.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #444;
            color: #7c1f7c;
            overflow-x: hidden;
        }

        nav.navbar {
            background-color: #7c3aed;
        }

        .navbar-brand, .nav-link {
            color: white;
        }

        .secondlist {
            margin-top: 50px;
        }

        .scroll-grid {
            overflow-x: auto;
            white-space: nowrap;
            padding: 20px 0;
        }

        .scroll-grid .row {
            flex-wrap: nowrap;
            margin-right: 0;
        }

        .scroll-grid::-webkit-scrollbar {
            height: 10px;
        }
        .scroll-grid::-webkit-scrollbar-thumb {
            background: plum;
            border-radius: 10px;
        }
        .scroll-grid::-webkit-scrollbar-track {
            background: #333;
        }

        .card {
            background: #222;
            color: #fff;
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px 0 rgba(251, 255, 255, 0.2), 0 6px 20px 0 rgba(12, 122, 123, 0.19);
            transition: transform 0.3s ease, box-shadow 0.4s ease-in-out;
            position: relative;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255,0,255,0.2);
        }

        .card img {
            height: 160px;
            object-fit: cover;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.7;
            transition: transform 0.3s, opacity 0.3s;
            pointer-events: none;
        }

        .card:hover .play-overlay {
            transform: translate(-50%, -50%) scale(1.2);
            opacity: 1;
        }

        .play-overlay svg {
            width: 50px;
            height: 50px;
            fill: plum;
        }

        .dugmic {
            background-color: plum;
            color: white;
            border-radius: 7px;
            height: 32px;
            width: 70px;
        }

        .bigcard {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: auto;
            max-width: 900px;
            background: #222;
            border-radius: 15px;
            color: #fff;
            margin: 100px auto;
            padding: 20px;
        }

        .lyrics-container {
            height: 310px;
            overflow-y: auto;
            background: #111;
            color: #fff;
            border-radius: 8px;
            padding: 15px;
            line-height: 1.6;
            font-size: 16px;
            scrollbar-width: thin;
            scrollbar-color: plum #333;
            margin-bottom: 30px;
        }

        .progress {
            width: 80%;
            height: 15px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 10%;
            height: 100%;
            background: linear-gradient(45deg, plum, #000000);
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #bbb;
            margin-top: 80px;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card-text {
            font-size: 0.75rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Bez Filtera</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Pesme</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Kontakt</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="secondlist container-fluid">

                        </svg>
